aid: prosimo
name: Prosimo
description: >-
  Prosimo is a multi-cloud networking platform that gives enterprises a
  full-stack cloud transit, security, performance, observability, and
  cost-management layer across AWS, Azure, Google Cloud, and Oracle Cloud.
  Its Application eXperience Infrastructure (AXI) abstracts cloud-provider
  networking constructs and ties network transit, micro-segmentation,
  zero-trust policy, WAF, and observability into an autonomous, ML-driven
  control plane. Prosimo exposes that control plane programmatically through
  a first-party Terraform provider (prosimo-io/prosimo) for full lifecycle
  management of cloud gateways, network and application onboarding, policies,
  namespaces, and security profiles; a companion Pulumi bridge repository and
  reusable Terraform modules are published on GitHub. Prosimo was
  venture-backed by General Catalyst, WRVI Capital, and BlackRock; industry
  sources report it was subsequently acquired by Palo Alto Networks.
